<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Makes the bundled Roboto fonts available to librsvg (via sharp) on ANY host,
  so text overlays render identically on a developer's Windows machine and on
  Railway's Linux container. Without this we'd depend on whatever fonts the host
  happens to have installed — which on a slim Linux image can be none, silently
  producing blank text. The server points FONTCONFIG_FILE at this file on boot
  (see config/fonts.js) and <dir> below is rewritten to an absolute path there.
-->
<fontconfig>
  <dir>__FONTS_DIR__</dir>
  <cachedir>__CACHE_DIR__</cachedir>

  <!-- Map the generic families our SVGs use onto the bundled Roboto. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias>
    <family>Arial</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
</fontconfig>
