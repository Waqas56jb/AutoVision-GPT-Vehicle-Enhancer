<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7faff" />
    <meta name="description" content="AutoVision GPT — AI-powered dealership-grade vehicle photo enhancement." />
    <title>AutoVision GPT — Vehicle Image Enhancer</title>
    <!-- Fonts offered for marketing tags (src/tags/tagModel.js → FONTS). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Barlow+Condensed:wght@500;700;800&family=Bebas+Neue&family=Montserrat:wght@500;700;800&family=Open+Sans:wght@500;700;800&family=Oswald:wght@500;700&family=Playfair+Display:wght@500;700;800&family=Poppins:wght@500;700;800&family=Roboto:wght@500;700;900&display=swap"
    />
    <script>
      /* Apply persisted theme before first paint to avoid a light flash. */
      try {
        var t = JSON.parse(localStorage.getItem('autovision.theme') || '"light"');
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>
    <style>
      /* Painted before React boots, so the first frame is already on-theme
         instead of a white flash followed by a layout jump. */
      body {
        margin: 0;
        background: #f7faff;
      }
      html.dark body {
        background: #0a1738;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f7faff;
        transition: opacity 0.4s ease;
      }
      html.dark #boot {
        background: #0a1738;
      }
      #boot.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot .ring {
        width: 44px;
        height: 44px;
        border-radius: 9999px;
        border: 3px solid #dbeafe;
        border-top-color: #2563eb;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot"><div class="ring"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // React has mounted by the time the module script finishes evaluating.
      window.addEventListener('load', () => {
        const boot = document.getElementById('boot');
        if (!boot) return;
        boot.classList.add('hide');
        setTimeout(() => boot.remove(), 450);
      });
    </script>
  </body>
</html>
